# ============================================
# TEST PROFILE \u2014 \u0438\u0437\u043E\u043B\u044F\u0446\u0438\u044F \u043E\u0442 \u043F\u0440\u043E\u0434\u0430
# ============================================

# \u0411\u0430\u0437\u0430 \u2014 H2 in-memory
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Liquibase \u2014 \u043C\u0438\u0433\u0440\u0430\u0446\u0438\u0438 \u043D\u0430 H2
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# JWT \u2014 \u0444\u0438\u043A\u0442\u0438\u0432\u043D\u044B\u0439 \u0441\u0435\u043A\u0440\u0435\u0442
jwt.secret=dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQ=

# Mail \u2014 \u0437\u0430\u0433\u043B\u0443\u0448\u043A\u0430, \u0447\u0442\u043E\u0431\u044B EmailService \u0441\u043E\u0437\u0434\u0430\u043B\u0441\u044F
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.ssl.enable=false

# \u041D\u0435 \u0438\u043D\u0438\u0446\u0438\u0430\u043B\u0438\u0437\u0438\u0440\u043E\u0432\u0430\u0442\u044C \u0434\u0435\u043C\u043E-\u0434\u0430\u043D\u043D\u044B\u0435
app.init-demo-data=false

# CORS \u2014 \u0434\u043B\u044F \u0442\u0435\u0441\u0442\u043E\u0432 \u043D\u0435 \u043D\u0443\u0436\u0435\u043D, \u043D\u043E \u0447\u0442\u043E\u0431\u044B \u043D\u0435 \u043F\u0430\u0434\u0430\u043B\u043E
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Upload
upload.path=${java.io.tmpdir}/mealtracker-test-uploads