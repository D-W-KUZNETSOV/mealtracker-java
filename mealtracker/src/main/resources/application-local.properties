# ============================================
# \u041F\u0420\u041E\u0424\u0418\u041B\u042C: H2 (\u0434\u043E\u043F\u043E\u043B\u043D\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0439)
# \u0410\u043A\u0442\u0438\u0432\u0438\u0440\u0443\u0435\u0442\u0441\u044F: --spring.profiles.active=local
# ============================================

# ============================================
# H2 \u0411\u0410\u0417\u0410 \u0414\u0410\u041D\u041D\u042B\u0425 (in-memory)
# ============================================
spring.datasource.url=jdbc:h2:mem:mealtrackerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# ============================================
# JPA \u0434\u043B\u044F H2
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# ============================================
# H2 CONSOLE (\u0412\u041A\u041B\u042E\u0427\u0415\u041D\u0410 \u0434\u043B\u044F \u044D\u0442\u043E\u0433\u043E \u043F\u0440\u043E\u0444\u0438\u043B\u044F)
# ============================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ============================================
# MVC
# ============================================
spring.mvc.dispatch-options-request=true

# ============================================
# \u0414\u0415\u041C\u041E-\u0414\u0410\u041D\u041D\u042B\u0415 (\u0434\u043B\u044F \u0442\u0435\u0441\u0442\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F)
# ============================================
app.init-demo-data=true
app.demo.default-username=dmitriy


