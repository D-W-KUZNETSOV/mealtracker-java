# ============================================
# \u041F\u0420\u041E\u0424\u0418\u041B\u042C: H2 (\u043B\u043E\u043A\u0430\u043B\u044C\u043D\u0430\u044F \u0440\u0430\u0437\u0440\u0430\u0431\u043E\u0442\u043A\u0430)
# ============================================

spring.datasource.url=jdbc:h2:mem:mealtrackerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.mvc.dispatch-options-request=true

# JWT \u0434\u043B\u044F \u043B\u043E\u043A\u0430\u043B\u044C\u043D\u043E\u0439 \u0440\u0430\u0437\u0440\u0430\u0431\u043E\u0442\u043A\u0438 \u2014 \u041D\u0415 \u0441\u0435\u043A\u0440\u0435\u0442, \u0442\u043E\u043B\u044C\u043A\u043E \u0434\u043B\u044F H2
jwt.secret=local-dev-secret-not-for-prod-32-chars-minimum!!

spring.liquibase.enabled=true

app.init-demo-data=true
app.demo.default-username=dmitriy
app.demo.default-password=demo

logging.level.liquibase=DEBUG
logging.level.org.hibernate.SQL=DEBUG
