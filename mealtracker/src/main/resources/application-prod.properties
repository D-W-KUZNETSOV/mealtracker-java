# ============================================
# \u041F\u0420\u041E\u0424\u0418\u041B\u042C: PROD (Railway / \u043E\u0431\u043B\u0430\u043A\u043E)
# ============================================
# \u0412\u0441\u0451 \u0431\u0435\u0440\u0451\u0442\u0441\u044F \u0438\u0437 application.properties + env:
# - DB_URL, DB_USERNAME, DB_PASSWORD \u2014 PostgreSQL \u043E\u0442 Railway
# - JWT_SECRET \u2014 \u0447\u0435\u0440\u0435\u0437 env
# - APP_CORS_ALLOWED_ORIGINS \u2014 \u0447\u0435\u0440\u0435\u0437 env
# ============================================

# \u042F\u0432\u043D\u043E \u043E\u0442\u043A\u043B\u044E\u0447\u0430\u0435\u043C H2-\u043A\u043E\u043D\u0441\u043E\u043B\u044C (\u0443\u0436\u0435 \u043E\u0442\u043A\u043B\u044E\u0447\u0435\u043D\u0430 \u0432 \u043E\u0431\u0449\u0435\u043C)
spring.h2.console.enabled=false

# \u0414\u0435\u043C\u043E-\u0434\u0430\u043D\u043D\u044B\u0435 \u0432\u044B\u043A\u043B\u044E\u0447\u0435\u043D\u044B
app.init-demo-data=false

# \u041B\u043E\u0433\u0438 \u2014 INFO (\u0431\u0435\u0437 DEBUG)
logging.level.liquibase=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.e.mealtracker=INFO
logging.level.org.springframework.web=INFO