# ============================================
# \u041E\u0421\u041D\u041E\u0412\u041D\u042B\u0415 \u041D\u0410\u0421\u0422\u0420\u041E\u0419\u041A\u0418
# ============================================
spring.application.name=mealtracker
server.port=8080

# ============================================
# \u0411\u0410\u0417\u0410 \u0414\u0410\u041D\u041D\u042B\u0425 (\u0438\u0437 \u043F\u0435\u0440\u0435\u043C\u0435\u043D\u043D\u044B\u0445 \u043E\u043A\u0440\u0443\u0436\u0435\u043D\u0438\u044F)
# ============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mealtracker_db}
spring.datasource.username=${DB_USERNAME:dmitriy}
spring.datasource.password=${DB_PASSWORD:banana19}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.connection-properties=useUnicode=true;characterEncoding=UTF-8

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# LIQUIBASE
# ============================================
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.parameters.liquibase.runInTransaction=false
spring.liquibase.enabled=true
spring.liquibase.drop-first=false
spring.liquibase.default-schema=public
spring.liquibase.database-change-log-table=databasechangelog
spring.liquibase.database-change-log-lock-table=databasechangeloglock

# ============================================
# JWT (\u0438\u0437 \u043F\u0435\u0440\u0435\u043C\u0435\u043D\u043D\u044B\u0445 \u043E\u043A\u0440\u0443\u0436\u0435\u043D\u0438\u044F)
# ============================================
jwt.secret=${JWT_SECRET:yUkMhwoaWKUpwoYylQ5Uh1FURFJGnOrNBIs7//+LRUI=}

# ============================================
# \u0414\u0415\u041C\u041E-\u0414\u0410\u041D\u041D\u042B\u0415 (\u0438\u0437 \u043F\u0435\u0440\u0435\u043C\u0435\u043D\u043D\u044B\u0445 \u043E\u043A\u0440\u0443\u0436\u0435\u043D\u0438\u044F)
# ============================================
app.init-demo-data=${APP_INIT_DEMO_DATA:true}
app.demo.default-username=${APP_DEMO_DEFAULT_USERNAME:dmitriy}

# ============================================
# \u041B\u041E\u0413\u0418\u0420\u041E\u0412\u0410\u041D\u0418\u0415
# ============================================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.liquibase=${LOGGING_LEVEL_LIQUIBASE:DEBUG}
logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL:DEBUG}

# ============================================
# \u041A\u041E\u0414\u0418\u0420\u041E\u0412\u041A\u0410
# ============================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ============================================
# SWAGGER/OPENAPI (\u0438\u0437 \u043F\u0435\u0440\u0435\u043C\u0435\u043D\u043D\u044B\u0445 \u043E\u043A\u0440\u0443\u0436\u0435\u043D\u0438\u044F)
# ============================================
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}

# ============================================
# JACKSON
# ============================================
