meta:
  environment: jvm
  toolchain:
    name: maven
    version: 17 # Укажи свою версию Java (у тебя 17 или 22)

build:
  args: -Dserver.port=80 # Заставляем Spring Boot слушать порт 80, как требует Amvera

run:
  jarName: target/mealtracker-0.0.1-SNAPSHOT.jar # Имя твоего JAR-файла после сборки
  containerPort: 80
  persistenceMount: /data # Сюда будем сохранять картинки